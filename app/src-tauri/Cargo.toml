[package]
name = "haul-app"
version = "0.2.1"
edition = "2024"
description = "Haul, a download manager"

[lib]
name = "haul_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "haul"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
haul-engine = { path = "../../crates/engine" }
chrono = "0.4"
url = "2"
tokio = { version = "1", features = ["full"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clipboard-master = "4"
arboard = { version = "3", default-features = false }
axum = "0.8.9"
getrandom = "0.3"
sha2 = "0.11.1"
tokio-util = "0.7"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Power", "Win32_System_Registry", "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_DataExchange", "Win32_System_Memory"] }
tauri-winrt-notification = "0.8"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }
