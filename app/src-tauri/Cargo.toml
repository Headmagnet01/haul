[package]
name = "haul-app"
version = "0.1.0"
edition = "2024"
description = "Haul, a download manager"

[lib]
name = "haul_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "haul"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
haul-engine = { path = "../../crates/engine" }
chrono = "0.4"
url = "2"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
tempfile = "3"
