[package]
name = "haul-engine"
version = "0.1.0"
edition = "2024"

[dependencies]
bytes = "1.12.1"
chrono = { version = "0.4.45", features = ["serde"] }
fs4 = "1.1.0"
futures = "0.3.34"
percent-encoding = "2.3.2"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "stream", "http2"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = "0.7.20"
tracing = "0.1.44"
url = "2.5.8"

[dev-dependencies]
axum = "0.8.9"
sha2 = "0.11.1"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["full", "test-util"] }
tracing-subscriber = "0.3.23"
