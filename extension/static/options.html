<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Haul options</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      body { max-width: 560px; padding: 24px; }
      form { display: grid; gap: 14px; margin-top: 14px; }
      label { display: grid; gap: 4px; font-weight: 500; }
      label .muted { font-weight: 400; }
      #types { width: 100%; }
      #minSize { width: 100px; }
    </style>
  </head>
  <body>
    <h1>Haul options</h1>
    <p class="muted small">Which browser downloads go to Haul. Hold Alt while clicking a link to keep a download in the browser.</p>
    <form id="form">
      <label>
        Catch downloads of at least (MB)
        <input id="minSize" type="number" min="0" step="0.1" />
      </label>
      <label>
        Always catch these file types
        <span class="muted small">Separated by spaces or commas, for example zip, exe, mp4.</span>
        <input id="types" type="text" spellcheck="false" />
      </label>
      <div class="row"><button class="btn primary" type="submit">Save</button><span id="saved" class="muted small" role="status"></span></div>
    </form>
    <script src="options.js"></script>
  </body>
</html>
